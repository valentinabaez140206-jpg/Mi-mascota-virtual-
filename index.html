<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Mascota Virtual</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(135deg,#eadcff,#fff0fa,#dff6ff);color:#342742}.app{max-width:500px;margin:auto;padding:16px;min-height:100vh}.hidden{display:none!important}button{border:0;border-radius:18px;background:white;padding:14px;font-weight:bold;box-shadow:0 5px 15px #0001}.selection{text-align:center;padding-top:40px}.groups{display:grid;grid-template-columns:1fr 1fr;gap:12px}.logo{height:80px;display:grid;place-items:center;border-radius:18px;font-size:28px}.bts{background:#d9c0ff}.bt21{background:#ffd0e5}.chars{display:grid;grid-template-columns:1fr 1fr;gap:9px}.char.sel{outline:3px solid #985de1;background:#f1e7ff}.face{font-size:45px}.confirm{width:100%;background:#8651d1;color:white;margin-top:15px}.top{display:flex;justify-content:space-between;background:#ffffffdd;padding:14px;border-radius:20px}.room{height:320px;margin-top:12px;border-radius:28px;position:relative;overflow:hidden;background:linear-gradient(#cbb2ed 0 62%,#c99d7d 62%)}.window{position:absolute;right:20px;top:25px;width:95px;height:105px;background:#9bdcff;border:7px solid white;border-radius:14px}.title{position:absolute;left:14px;top:14px;background:white;padding:8px;border-radius:12px}.avatar{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);font-size:90px}.dance{animation:dance .7s infinite alternate}@keyframes dance{to{transform:translate(-50%,-55%) rotate(8deg) scale(1.1)}}.bubble{position:absolute;top:65px;left:50%;transform:translateX(-50%);background:white;padding:8px 12px;border-radius:18px}.stats{background:#ffffffdd;padding:12px;border-radius:20px;margin-top:12px}.stat{display:grid;grid-template-columns:80px 1fr 28px;gap:6px;margin:7px 0;font-size:12px}.bar{height:10px;background:#eadff1;border-radius:10px;overflow:hidden}.bar div{height:100%;background:#9e68d4}.rooms,.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.actions{grid-template-columns:repeat(3,1fr)}.rooms button{padding:9px 2px;font-size:20px}.rooms small{display:block;font-size:8px}.modal{position:fixed;inset:0;background:#24192dcc;display:grid;place-items:center;padding:18px}.box{background:white;max-width:420px;width:100%;border-radius:25px;padding:22px;text-align:center}.food{display:grid;grid-template-columns:1fr 1fr;gap:8px}.food button{font-size:14px}.food span{font-size:32px;display:block}.close{float:right}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8fc8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
</head><body><div class="app"><section id="select" class="selection"><h1>💜 Mi Mascota Virtual</h1><p>Elegí tu mundo</p><div class="groups"><button onclick="group('BTS')"><div class="logo bts">BTS</div><h2>BTS</h2><small>Miembro o los 7</small></button><button onclick="group('BT21')"><div class="logo bt21">BT21</div><h2>BT21</h2><small>Personaje o los 7</small></button></div><div id="cb" class="hidden"><h2 id="ct"></h2><div id="chars" class="chars"></div><button class="confirm" onclick="start()">✨ CONFIRMAR</button></div></section><section id="game" class="hidden"><div class="top"><div><small id="gn"></small><h2 id="cn"></h2></div>🪙 <span id="coins">100</span></div><div class="room"><div id="rt" class="title">🛏️ Habitación</div><div class="window"></div><div id="bubble" class="bubble hidden"></div><div id="av" class="avatar">🧸</div></div><div class="stats"><div class="stat">🍚 Hambre<div class="bar"><div id="h"></div></div><b id="hn"></b></div><div class="stat">⚡ Energía<div class="bar"><div id="e"></div></div><b id="en"></b></div><div class="stat">🫧 Higiene<div class="bar"><div id="hy"></div></div><b id="hyn"></b></div><div class="stat">🎮 Diversión<div class="bar"><div id="f"></div></div><b id="fn"></b></div><div class="stat">💜 Ánimo<div class="bar"><div id="m"></div></div><b id="mn"></b></div></div><div id="rooms" class="rooms"></div><div id="actions" class="actions"></div></section></div><div id="modal" class="modal hidden"><div class="box"><button class="close" onclick="closeM()">✕</button><div id="body"></div></div></div><script>
let G='',C='',sel='',coins=100,s={h:70,e:70,hy:80,f:65,m:75};const B=[['RM','🧑🏻‍🎤'],['Jin','🧑🏻‍🎤'],['SUGA','🧑🏻‍🎤'],['j-hope','🧑🏽‍🎤'],['Jimin','🧑🏻‍🎤'],['V','🧑🏻‍🎤'],['Jung Kook','🧑🏻‍🎤'],['Los 7','👥']],T=[['KOYA','🐨'],['RJ','🦙'],['SHOOKY','🍪'],['MANG','🐴'],['CHIMMY','🐶'],['TATA','❤️'],['COOKY','🐰'],['Los 7','👥']];
function group(g){G=g;cb.classList.remove('hidden');ct.textContent=g==='BTS'?'💜 Elegí tu miembro':'💗 Elegí tu personaje';chars.innerHTML='';(g==='BTS'?B:T).forEach(x=>{let b=document.createElement('button');b.className='char';b.innerHTML=`<div class=face>${x[1]}</div><b>${x[0]}</b>`;b.onclick=()=>{document.querySelectorAll('.char').forEach(q=>q.classList.remove('sel'));b.classList.add('sel');sel=x[0]};chars.appendChild(b)})}
const icon={KOYA:'🐨',RJ:'🦙',SHOOKY:'🍪',MANG:'🐴',CHIMMY:'🐶',TATA:'❤️',COOKY:'🐰','Los 7':'👥'};function start(){if(!sel)return alert('Elegí un personaje 💜');C=sel;select.classList.add('hidden');game.classList.remove('hidden');gn.textContent=G;cn.textContent=C;av.textContent=icon[C]||'🧑🏻‍🎤';room('habitacion');upd()}
function lim(x){return Math.max(0,Math.min(100,x))}function upd(){for(let [k,id] of [['h','h'],['e','e'],['hy','hy'],['f','f'],['m','m']]){s[k]=lim(s[k]);document.getElementById(id).style.width=s[k]+'%';document.getElementById(id+'n').textContent=Math.round(s[k])}document.getElementById('coins').textContent=Math.max(0,coins)}function msg(x){bubble.textContent=x;bubble.classList.remove('hidden');setTimeout(()=>bubble.classList.add('hidden'),1400)}
function room(r){let list=[],title='';if(r==='habitacion'){title='🛏️ Habitación';list=[['👕','Ropa',clothes],['📷','Cámara',camera],['🪴','Decorar',decor],['💤','Dormir',sleep]]}if(r==='cocina'){title='🍳 Cocina / Comedor';list=[['🛒','Almacén',food],['👨‍🍳','Cocinar',cook]]}if(r==='juegos'){title='🎮 Sala de juegos';list=[['🎤','Cantar',sing],['💃','Bailar',dance],['🧸','Minijuegos',games]]}if(r==='baño'){title='🛁 Baño';list=[['🚿','Bañar',bath]]}if(r==='patio'){title='🌳 Patio';list=[['🌐','Online',online],['⚽','Jugar',play],['📷','Fotos',camera]]}rt.textContent=title;actions.innerHTML='';list.forEach(x=>{let b=document.createElement('button');b.innerHTML=x[0]+'<br>'+x[1];b.onclick=x[2];actions.appendChild(b)});rooms.innerHTML='';[['🛏️','Habitación','habitacion'],['🍳','Cocina','cocina'],['🎮','Juegos','juegos'],['🛁','Baño','baño'],['🌳','Patio','patio']].forEach(x=>{let b=document.createElement('button');b.innerHTML=x[0]+'<small>'+x[1]+'</small>';b.onclick=()=>room(x[2]);rooms.appendChild(b)})}
function openM(x){body.innerHTML=x;modal.classList.remove('hidden')}function closeM(){modal.classList.add('hidden')}
function food(){openM('<h2>🛒 Almacén</h2><div class=food><button onclick="eat(12,\'🍎 Manzana\')"><span>🍎</span>Manzana</button><button onclick="eat(18,\'🍕 Pizza\')"><span>🍕</span>Pizza</button><button onclick="eat(20,\'🍜 Ramen\')"><span>🍜</span>Ramen</button><button onclick="eat(15,\'🍰 Pastel\')"><span>🍰</span>Pastel</button></div><button onclick="cook()">👨‍🍳 Preparar comida</button>')}function eat(v,n){closeM();s.h+=v;s.m+=5;s.f+=3;coins-=2;msg('¡'+n+'!');dance();upd()}function cook(){openM('<h2>👨‍🍳 Preparar comida</h2><button onclick="made(25,\'🍳 Desayuno\')">🍳 Desayuno</button><button onclick="made(25,\'🍝 Pasta\')">🍝 Pasta</button><button onclick="made(25,\'🥗 Ensalada\')">🥗 Ensalada</button>')}function made(v,n){closeM();msg('👨‍🍳 Preparando...');setTimeout(()=>{s.h+=v;s.m+=8;msg(n+' ¡Listo!');upd()},800)}
function bath(){openM('<h2>🛁 Hora del baño</h2><div style="font-size:70px">🛁 🧑</div><p id=bt>Primero: 🚿 mojar.</p><div class=bar><div id=bp style="width:0"></div></div><button onclick="step(1)">🚿</button><button onclick="step(2)">🧼</button><button onclick="step(3)">🚿</button>');window.p=0}function step(n){if(n===1){p=33;bt.textContent='💦 Mojado. Ahora 🧼 jabón.'}if(n===2){if(p<33){bt.textContent='Primero mojalo.';return}p=66;bt.textContent='🫧 ¡Espuma! Ahora enjuagalo.'}if(n===3){if(p<66){bt.textContent='Primero jabón.';return}p=100;bt.textContent='✨ ¡Baño terminado!';s.hy=100;s.m+=10}bp.style.width=p+'%';upd()}
function games(){openM('<h2>🎮 Minijuegos</h2><div class=food><button onclick="mini()"><span>🧩</span>Rompecabezas</button><button onclick="mini()"><span>🃏</span>Memoria</button><button onclick="mini()"><span>🏎️</span>Carrera</button><button onclick="mini()"><span>⭐</span>Habilidad</button></div>')}function mini(){closeM();s.f+=20;s.m+=10;s.e-=10;coins+=10;msg('🎮 ¡Ganaste!');upd()}function sing(){openM('<h2>🎤 Modo show</h2><div style="font-size:80px">🎤</div><p>¡Está cantando!</p><button onclick="dance()">💃 Bailar</button>');s.f+=15;s.m+=15;s.e-=5;coins+=5;upd()}function dance(){closeM();av.classList.add('dance');setTimeout(()=>av.classList.remove('dance'),1800);s.f+=15;s.m+=10;s.e-=7;msg('💃 ¡Bailando!');upd()}function sleep(){s.e+=35;s.m+=5;msg('💤 Zzz...');upd()}function play(){s.f+=20;s.m+=10;s.e-=12;coins+=10;msg('🎮 ¡Qué divertido!');upd()}function clothes(){openM('<h2>👕 Vestidor</h2><button>🧥 Casual</button><button>🎤 Escenario</button><button>🧢 Deportivo</button>')}function camera(){openM('<h2>📷 Cámara</h2><div style="font-size:80px;padding:25px">'+av.textContent+'</div><button onclick="closeM();msg(\'📸 ¡Foto!\')">📸 Sacar foto</button>')}function decor(){openM('<h2>🪴 Decorar</h2><button>🛏️ Cama</button><button>🪴 Planta</button><button>💡 Lámpara</button>')}function online(){openM('<h2>🌐 Mundo online</h2><div style="font-size:65px">🌎</div><p>Acá agregaremos amigos, visitas y minijuegos online.</p>')}setInterval(()=>{s.h--;s.e-=.5;s.f-=.5;s.hy-=.3;upd()},15000);</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script></body></html>
